<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Eethal Learning Talent Directory — Discover working professionals and students from Tamil Nadu." />
<title>Eethal Learning — Talent Directory</title>
<!-- DNS prefetch for faster CDN connections -->
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts: only load weights we actually use -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<!-- React & ReactDOM loaded first (critical) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel loaded last (non-blocking defer trick not possible with text/babel, so keep inline) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --navy:#0B1330;
  --navy-2:#141B42;
  --navy-3:#1B2454;
  --indigo:#5B5FEF;
  --indigo-dark:#4640D6;
  --purple:#8B5CF6;
  --teal:#0FA981;
  --teal-soft:#E4F7F1;
  --red:#E5484D;
  --red-soft:#FCE8E8;
  --amber:#DC8A1D;
  --amber-soft:#FBF0DE;
  --bg:#F5F6FB;
  --card:#FFFFFF;
  --card-hover:#F8F9FE;
  --border:#E6E8F1;
  --border-bright:#D0D4E8;
  --text:#12142A;
  --text-soft:#5B5F76;
  --text-faint:#94969F;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,20,45,0.04);
  --shadow-md:0 6px 20px rgba(16,20,45,0.08);
  --shadow-lg:0 20px 48px rgba(16,20,45,0.16);
  --glow:0 0 0 transparent;
  --blur:none;
  --blur-sm:none;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#F5F6FB;
  background-attachment:fixed;
  min-height:100vh;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.font-display{font-family:'Lexend','Inter',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text);}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D4D7E6;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Layout ---------- */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}
.app-shell.with-sidebar{flex-direction:row;}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.app-shell.with-sidebar .main-area{margin-left:264px;}
.sidebar{
  width:264px;flex-shrink:0;
  background:#0B1330;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border-right:none;
  display:flex;flex-direction:column;padding:22px 16px;
  position:fixed;top:0;left:0;height:100vh;z-index:40;
}
.sidebar-logo-row{display:flex;align-items:center;gap:10px;padding:6px 10px 26px;}
.sidebar-badge{
  margin:0 10px 18px;padding:9px 12px;border-radius:10px;background:rgba(91,95,239,0.15);
  border:1px solid rgba(91,95,239,0.3);color:#C7CCFF;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.nav-section{flex:1;display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  color:#AEB2CC;font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;transform:none;}
.nav-item.active{
  background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));color:#fff;
  border:none;
  box-shadow:0 4px 14px rgba(91,95,239,0.35);
}
.nav-item svg{flex-shrink:0;}
.nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:10px 4px;}
.logo-mark{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--indigo),var(--purple));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(91,95,239,0.45);
}
.logo-text{color:var(--navy);font-weight:700;font-size:16.5px;letter-spacing:-0.01em;}
.logo-text.on-dark{color:#fff;}
.brand-row{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--border);margin-right:6px;}

/* ---------- Topbar ---------- */
.header-shell{background:#0B1330;position:sticky;top:0;z-index:30;border-bottom:none;backdrop-filter:none;-webkit-backdrop-filter:none;}
.topbar{
  height:68px;background:#FFFFFF;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;
}
.subnav{
  display:flex;align-items:center;gap:4px;padding:0 24px;background:#0B1330;height:52px;overflow-x:auto;border-top:none;
}
.subnav-item{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;
  color:#AEB2CC;font-size:13.5px;font-weight:500;white-space:nowrap;
  border:none;background:none;transition:background .15s,color .15s;
}
.subnav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.subnav-item.active{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));color:#fff;box-shadow:0 4px 14px rgba(91,95,239,0.3);border:none;}
.subnav-item svg{flex-shrink:0;}
.search-box{
  flex:1;max-width:440px;display:flex;align-items:center;gap:10px;
  background:#F5F6FB;border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  backdrop-filter:none;
}
.search-box:focus-within{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,95,239,0.1);}
.search-box input{border:none;background:none;outline:none;flex:1;font-size:13.5px;color:var(--text);}
.search-box input::placeholder{color:var(--text-faint);}
.search-box svg{flex-shrink:0;color:var(--text-faint);}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto;position:relative;}
.icon-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#FFFFFF;
  backdrop-filter:none;
  display:flex;align-items:center;justify-content:center;color:var(--text-soft);position:relative;
  transition:background .15s;
}
.icon-btn:hover{background:#F5F6FB;border-color:var(--border-bright);}
.badge-dot{
  position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--red);border:2px solid #FFFFFF;
}
.admin-chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;border:1px solid var(--border);background:#FFFFFF;backdrop-filter:none;transition:background .15s;}
.admin-chip:hover{background:#F5F6FB;}
.avatar{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;flex-shrink:0;
}
.hamburger-btn{display:none;}

/* ---------- Content ---------- */
.content{padding:28px;flex:1;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:24px;margin:0 0 4px;letter-spacing:-0.01em;color:var(--text);text-shadow:none;}
.page-head p{margin:0;color:var(--text-soft);font-size:14px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:10px 16px;
  font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));color:#fff;box-shadow:0 6px 16px rgba(91,95,239,0.35);}
.btn-primary:hover{box-shadow:0 8px 20px rgba(91,95,239,0.45);transform:none;}
.btn-secondary{background:#FFFFFF;color:var(--text);border-color:var(--border);backdrop-filter:none;}
.btn-secondary:hover{background:#F5F6FB;}
.btn-danger{background:var(--red);color:#fff;border-color:transparent;}
.btn-danger:hover{background:#D3383D;}
.btn-ghost{background:none;color:var(--text-soft);border-color:transparent;}
.btn-ghost:hover{background:#F5F6FB;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ---------- Stat cards ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:26px;}
.stat-card{
  background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:box-shadow .15s,transform .15s;position:relative;overflow:hidden;
}
.stat-card::before{display:none;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--indigo);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--text);}
.stat-label{font-size:13px;color:var(--text-soft);margin-top:2px;}

/* ---------- Section ---------- */
.section-card{background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:24px;backdrop-filter:none;-webkit-backdrop-filter:none;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-head h3{font-size:15.5px;margin:0;color:var(--text);}
.link-btn{font-size:13px;color:var(--indigo);font-weight:600;background:none;border:none;}

/* ---------- Filters ---------- */
.filter-bar{background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;backdrop-filter:none;-webkit-backdrop-filter:none;}
.filter-search{display:flex;align-items:center;gap:10px;background:#F5F6FB;border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:14px;}
.filter-search input{flex:1;border:none;background:none;outline:none;font-size:13.5px;color:var(--text);}
.filter-search input::placeholder{color:var(--text-faint);}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filter-select{
  border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;
  color:var(--text);background:#FFFFFF;min-width:150px;
  backdrop-filter:none;appearance:auto;-webkit-appearance:auto;cursor:pointer;
  transition:border-color .15s;
}
.filter-select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,95,239,0.1);}
.filter-select option{background:#FFFFFF;color:var(--text);}
.filter-search input:focus{outline:none;}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{flex-shrink:0;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;background:#FFFFFF;color:var(--text-soft);white-space:nowrap;transition:all .15s;}
.chip.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}

/* ---------- Cards grid ---------- */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.profile-card{
  background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:box-shadow .15s,border-color .15s,transform .15s;
  cursor:pointer;position:relative;overflow:hidden;
}
.profile-card::before{display:none;}
.profile-card:hover{box-shadow:var(--shadow-md);border-color:var(--indigo);transform:translateY(-2px);}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;}
.pc-name{font-size:15px;font-weight:700;margin:12px 0 2px;color:var(--text);}
.pc-role{font-size:13px;color:var(--text-soft);margin:0;}
.pc-sub{font-size:12.5px;color:var(--text-faint);margin:2px 0 0;}
.pc-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);margin-top:12px;}
.pc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.pc-tag{background:var(--teal-soft);color:var(--teal);font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;border:none;}
.view-profile-pop{
  position:absolute;inset:0;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,0.92) 60%);
  opacity:0;transition:opacity .15s;pointer-events:none;
}
.profile-card:hover .view-profile-pop{opacity:1;}
.view-profile-pop span{background:#0B1330;color:#fff;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;margin-top:60px;box-shadow:none;}

.dots-btn{
  width:28px;height:28px;border-radius:8px;border:none;
  background:rgba(255,255,255,0.06);
  color:var(--text-faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.dots-btn:hover{background:rgba(255,255,255,0.12);color:var(--text);}
.dropdown-menu{
  position:absolute;background:#FFFFFF;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);
  padding:6px;z-index:50;min-width:160px;
}
.dropdown-menu button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:none;
  background:none;font-size:13px;color:var(--text);
  transition:background .12s;
}
.dropdown-menu button:hover{background:#F5F6FB;}
.dropdown-menu button.danger{color:var(--red);}
.dropdown-menu button.role-active{background:#EEF0FF;color:var(--indigo);font-weight:600;}
.dropdown-divider{height:1px;background:var(--border);margin:5px 4px;}
.role-tag{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-faint);}

/* ---------- Pagination ---------- */
.pagination-row{display:flex;align-items:center;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:10px;}
.pagination-info{font-size:12.5px;color:var(--text-soft);}
.pagination-controls{display:flex;gap:6px;}
.page-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#FFFFFF;font-size:13px;color:var(--text-soft);}
.page-btn:hover:not(:disabled){background:#F5F6FB;color:var(--text);}
.page-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);box-shadow:none;}
.page-btn:disabled{opacity:0.4;}

/* ---------- Empty state ---------- */
.empty-state{
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 20px;
  background:#FFFFFF;border:1px dashed var(--border);border-radius:var(--radius);
}
.empty-state h3{margin:16px 0 6px;font-size:16px;color:var(--text);}
.empty-state p{margin:0 0 18px;color:var(--text-soft);font-size:13.5px;max-width:320px;}

/* ---------- Detail page ---------- */
.detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.back-btn{display:flex;align-items:center;gap:7px;color:var(--text-soft);font-size:13.5px;font-weight:600;background:none;border:none;transition:color .15s;}
.back-btn:hover{color:var(--text);}
.profile-header-card{
  background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-sm);
  display:flex;gap:22px;align-items:center;margin-bottom:20px;flex-wrap:wrap;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.ph-name-row{display:flex;align-items:center;gap:8px;}
.ph-name-row h2{font-size:21px;margin:0;color:var(--text);}
.ph-role{color:var(--text-soft);font-size:14px;margin:4px 0 10px;}
.ph-contacts{display:flex;gap:18px;flex-wrap:wrap;}
.ph-contact-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-soft);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;}
.detail-field{padding:14px 0;border-bottom:1px solid var(--border);}
.detail-field .label{font-size:12px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.detail-field .value{font-size:14px;font-weight:500;color:var(--text);}

/* ---------- Forms ---------- */
.tab-toggle{
  display:inline-flex;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:4px;margin-bottom:22px;
}
.tab-toggle button{
  padding:9px 18px;border-radius:9px;border:none;background:none;
  font-size:13.5px;font-weight:600;color:var(--text-soft);
  transition:all .15s;
}
.tab-toggle button.active{
  background:var(--indigo);
  color:#fff;
  border:none;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12.5px;font-weight:600;color:var(--text-soft);}
.form-field label .req{color:var(--red);}
.form-field input, .form-field select, .form-field textarea{
  border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;
  font-size:13.5px;color:var(--text);
  background:#FFFFFF;
  backdrop-filter:none;
  transition:border-color .15s,box-shadow .15s;
}
.form-field select option{background:#FFFFFF;color:var(--text);}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{
  outline:none;
  border-color:var(--indigo);
  box-shadow:0 0 0 3px rgba(91,95,239,0.12);
}
.form-field .err-text{font-size:11.5px;color:var(--red);}
.form-field.error input, .form-field.error select{border-color:var(--red);}
.photo-upload{display:flex;align-items:center;gap:14px;}
.upload-box{
  border:1.5px dashed var(--border);
  border-radius:10px;padding:12px 16px;
  font-size:12.5px;color:var(--text-soft);
  background:#F5F6FB;
}
.form-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:26px;
  padding-top:20px;border-top:1px solid var(--border);
}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,30,0.5);backdrop-filter:none;-webkit-backdrop-filter:none;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-card{background:#FFFFFF;border:none;border-radius:var(--radius);padding:26px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);backdrop-filter:none;-webkit-backdrop-filter:none;}
.modal-icon{width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.modal-card h3{margin:0 0 8px;font-size:16.5px;color:var(--text);}
.modal-card p{margin:0 0 20px;font-size:13.5px;color:var(--text-soft);line-height:1.5;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.status-badge{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.status-active{background:var(--teal-soft);color:var(--teal);}
.status-inactive{background:var(--red-soft);color:var(--red);}
.role-badge{background:#EEF0FF;color:var(--indigo);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:#0B1330;border:none;backdrop-filter:none;
  color:#fff;
  padding:13px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);z-index:200;
  display:flex;align-items:center;gap:10px;
}

/* ---------- Notification dropdown ---------- */
.notif-panel{
  position:absolute;top:52px;right:0;width:340px;
  background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;max-height:420px;overflow-y:auto;
}
.notif-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;color:var(--text);}
.notif-item{display:flex;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);}

  .card-grid{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}

.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1330;position:relative;overflow:hidden;padding:20px;}
.login-shell::before{
  content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,95,239,0.35),transparent 70%);top:-200px;right:-160px;

.login-shell::after{
  content:'';position:absolute;width:500px;height:500px;border-radius:50%;

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return Math.abs(h); }
function gradientFor(name){ const g=GRADIENTS[hashStr(name)%GRADIENTS.length]; return {background:`linear-gradient(135deg, ${g[0]}, ${g[1]})`}; }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function pick(arr,seed){ return arr[seed % arr.length]; }

/* ============ SMALL COMPONENTS ============ */
function extractDriveId(url){
  if(!url || typeof url !== 'string') return null;
  const trimmed = url.trim();
  if(trimmed.startsWith('data:')) return null;
  if(trimmed.includes('drive.google.com') || trimmed.includes('googleusercontent.com')){
    const match = trimmed.match(/id=([a-zA-Z0-9_-]+)/) || trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
    return match ? match[1] : null;
  }
  return null;
}

function Avatar({name,size=44,gradient,photo}){
  const driveId = useMemo(()=>extractDriveId(photo), [photo]);
  const [attempt, setAttempt] = useState(0);
  const [loaded, setLoaded] = useState(false);

  useEffect(()=>{
    setAttempt(0);
    setLoaded(false);
  }, [photo]);

  const bg = gradient
    ? {background:`linear-gradient(135deg, ${gradient[0]}, ${gradient[1]})`}
    : gradientFor(name);

  let currentSrc = null;
  if(photo && typeof photo === 'string' && photo.trim()){
    const trimmed = photo.trim();
    if(driveId){
      if(attempt === 0) currentSrc = `https://lh3.googleusercontent.com/d/${driveId}`;
      else if(attempt === 1) currentSrc = `https://drive.google.com/thumbnail?id=${driveId}&sz=w500`;
      else if(attempt === 2) currentSrc = `https://drive.google.com/uc?export=view&id=${driveId}`;
    } else if(attempt === 0 && (trimmed.startsWith('/') || trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('data:'))){
      currentSrc = trimmed;
    }
  }

  if(currentSrc){
    return (
      <div style={{width:size,height:size,borderRadius:'50%',flexShrink:0,position:'relative',overflow:'hidden'}}>
        {!loaded && <div style={{position:'absolute',inset:0,...bg,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:size*0.36}}>{initials(name)}</div>}
        <img src={currentSrc} alt={name} className="avatar"
          loading="lazy"
          style={{width:size,height:size,objectFit:'cover',borderRadius:'50%',boxShadow:'0 2px 8px rgba(0,0,0,0.1)',flexShrink:0,opacity:loaded?1:0,transition:'opacity .25s'}}
          onLoad={()=>setLoaded(true)}
          onError={()=>{setAttempt(a=>a+1);setLoaded(false);}}/>
      </div>
    );
  }

  return (
    <div className="avatar" style={{width:size,height:size,fontSize:size*0.36, ...bg}}>
      {initials(name)}
    </div>
  );
}

function Toast({message,onClose}){
  useEffect(()=>{ const t=setTimeout(onClose,2600); return ()=>clearTimeout(t); },[message]);
  if(!message) return null;
  return (
    <div className="toast"><I.CheckCircle style={{color:'#12B76A',flexShrink:0}}/> {message}</div>
  );
}

function useOutsideClose(ref,onClose){
  useEffect(()=>{
    function handler(e){ if(ref.current && !ref.current.contains(e.target)) onClose(); }
    document.addEventListener("mousedown",handler);
    return ()=>document.removeEventListener("mousedown",handler);
  },[ref,onClose]);
}

function CardMenu({onView,onEdit,onDelete,isAdmin}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useOutsideClose(ref,()=>setOpen(false));
  if(!isAdmin) return null;
  return (
    <div style={{position:'relative'}} ref={ref} onClick={e=>e.stopPropagation()}>
      <button className="dots-btn" onClick={()=>setOpen(o=>!o)}><I.Dots/></button>
      {open && (
        <div className="dropdown-menu" style={{right:0,top:30}}>
          <button onClick={()=>{setOpen(false);onView();}}><I.Eye/> View Profile</button>
          <button onClick={()=>{setOpen(false);onEdit();}}><I.Edit/> Edit</button>
          <button className="danger" onClick={()=>{setOpen(false);onDelete();}}><I.Trash/> Delete</button>
        </div>
      )}
    </div>
  );
}

function EmptyState({title,subtitle,actionLabel,onAction}){
  return (
    <div className="empty-state">
      <I.Empty style={{color:'#C7CADC'}}/>
      <h3>{title}</h3>
      <p>{subtitle}</p>
      {actionLabel && <button className="btn btn-primary" onClick={onAction}><I.Plus/>{actionLabel}</button>}
    </div>
  );
}

function Pagination({page,setPage,total,pageSize}){
  const totalPages = Math.max(1,Math.ceil(total/pageSize));
  if(total===0) return null;
  const start = (page-1)*pageSize+1;
  const end = Math.min(total,page*pageSize);
  const pages = Array.from({length:totalPages},(_,i)=>i+1).slice(0,5);
  return (
    <div className="pagination-row">
      <div className="pagination-info">Showing {start}{'\u2013'}{end} of {total} profiles</div>
      <div className="pagination-controls">
        <button className="page-btn" disabled={page===1} onClick={()=>setPage(p=>p-1)}>{'\u2039'}</button>
        {pages.map(p=>(
          <button key={p} className={"page-btn"+(p===page?" active":"")} onClick={()=>setPage(p)}>{p}</button>
        ))}
        <button className="page-btn" disabled={page===totalPages} onClick={()=>setPage(p=>p+1)}>{'\u203a'}</button>
      </div>
    </div>
  );
}

function ProfessionalsPage({professionals,openDetail,openAdd,openEdit,openDelete,isAdmin}){
  const [search,setSearch]=useState("");
  const [f,setF]=useState({district:"",experience:"",designation:"",company:"",education:""});
  const [page,setPage]=useState(1);
  const pageSize=8;

  // Dynamic filter options derived from actual data
  const filterOpts = useMemo(()=>({
    districts: [...new Set(professionals.map(p=>p.district).filter(Boolean))].sort(),
    designations: [...new Set(professionals.map(p=>p.designation).filter(Boolean))].sort(),
    companies: [...new Set(professionals.map(p=>p.company).filter(Boolean))].sort(),
    educations: [...new Set(professionals.map(p=>p.education).filter(Boolean))].sort(),
  }),[professionals]);

  const filtered = useMemo(()=>{
    return professionals.filter(p=>{
      const s = search.toLowerCase();
      const matchesSearch = !s || p.name.toLowerCase().includes(s) || p.company.toLowerCase().includes(s) || p.designation.toLowerCase().includes(s) || p.district.toLowerCase().includes(s);
      const matchesDistrict = !f.district || p.district===f.district;
      const matchesDesig = !f.designation || p.designation===f.designation;
      const matchesCompany = !f.company || p.company===f.company;
      const matchesEdu = !f.education || p.education===f.education;
      const exp = parseFloat(p.experience) || 0;
      const matchesExp = !f.experience || (
        f.experience==="0-2" ? exp<2 :
        f.experience==="2-5" ? (exp>=2 && exp<5) :
        f.experience==="5-8" ? (exp>=5 && exp<8) : exp>=8
      );
      return matchesSearch && matchesDistrict && matchesDesig && matchesCompany && matchesEdu && matchesExp;
    });
  },[professionals,search,f]);

  const pageItems = filtered.slice((page-1)*pageSize,page*pageSize);
  const resetFilters=()=>{setSearch("");setF({district:"",experience:"",designation:"",company:"",education:""});setPage(1);};
  const hasNoData = professionals.length===0;

  return (
    <div>
      <div className="page-head">
        <div><h1 className="font-display">Working Professionals</h1><p>Discover and manage experienced professionals.</p></div>
        {isAdmin && <button className="btn btn-primary" onClick={openAdd}><I.Plus/> Add Professional</button>}

      <div className="filter-bar">
        <div className="filter-search">
          <I.Search/>
          <input placeholder="Search by name, company, designation..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/>
        </div>
        <div className="filter-row">
          <FilterSelect value={f.district} onChange={v=>{setF({...f,district:v});setPage(1);}} options={filterOpts.districts} placeholder="Current District"/>
          <FilterSelect value={f.experience} onChange={v=>{setF({...f,experience:v});setPage(1);}} options={["0-2","2-5","5-8","8+"]} placeholder="Experience"/>
          <FilterSelect value={f.designation} onChange={v=>{setF({...f,designation:v});setPage(1);}} options={filterOpts.designations} placeholder="Designation"/>
          <FilterSelect value={f.company} onChange={v=>{setF({...f,company:v});setPage(1);}} options={filterOpts.companies} placeholder="Company"/>
          <FilterSelect value={f.education} onChange={v=>{setF({...f,education:v});setPage(1);}} options={filterOpts.educations} placeholder="Education"/>
          <button className="btn btn-secondary btn-sm" onClick={resetFilters}>Reset</button>
        </div>
      </div>

      {hasNoData ? (
        <EmptyState title="No Professionals Added Yet" subtitle="Start building your talent directory by adding your first professional." actionLabel={isAdmin?"Add Professional":undefined} onAction={openAdd}/>
      ) : filtered.length===0 ? (
        <EmptyState title="No profiles found" subtitle="Try changing your search or filters." actionLabel="Clear Filters" onAction={resetFilters}/>
      ) : (
        <>
        <div className="card-grid">
          {pageItems.map(p=>(
            <ProfessionalCard key={p.id} p={p} onClick={()=>openDetail("professional",p.id)} onEdit={()=>openEdit("professional",p)} onDelete={()=>openDelete("professional",p)} isAdmin={isAdmin}/>
          ))}
        </div>
        <Pagination page={page} setPage={setPage} total={filtered.length} pageSize={pageSize}/>
        </>
      )}
    </div>
  );
}

                <DetailField label="Current CTC" value={data.ctc}/>
                <DetailField label="Education Qualification" value={data.education}/>
                <DetailField label="Current Address" value={data.address}/>
              </>
            ) : (
              <>
                <DetailField label="Year of Graduation" value={data.gradYear}/>
                <DetailField label="Education Qualification" value={data.education}/>
                <DetailField label="Current Address" value={data.address}/>
              </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ ADD / EDIT FORM ============ */
function ProfileForm({mode,initialType,initialData,onCancel,onSave}){
  const [type,setType]=useState(initialType||"professional");
  const blankPro = {name:"",mobile:"",email:"",district:"",experience:"",company:"",designation:"",ctc:"",education:"",address:""};
  const blankStu = {name:"",mobile:"",email:"",district:"",specialization:"",gradYear:"",education:"",address:""};
  const [data,setData]=useState(initialData || (type==="professional"?blankPro:blankStu));
  const [errors,setErrors]=useState({});

  useEffect(()=>{
    if(!initialData){ setData(type==="professional"?blankPro:blankStu); setErrors({}); }
  },[type]);

  function update(field,val){ setData(d=>({...d,[field]:val})); }

  function handleFileSelect(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){
      alert("Please select an image smaller than 5MB.");
      return;
    }
    const reader = new FileReader();
    reader.onload = (evt)=>{
      update("photo", evt.target.result);
    };
    reader.readAsDataURL(file);
  }

  function validate(){
    const e={};
    if(!data.name || !data.name.trim()) e.name="Full name is required.";
    if(!data.mobile || !/^\d{10}$/.test(data.mobile)) e.mobile="Enter a valid 10-digit mobile number.";
    if(!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) e.email="Enter a valid email address.";
    if(!data.district) e.district="Current district is required.";
    if(!data.education) e.education="Education qualification is required.";
    if(type==="professional"){
      if(!data.experience) e.experience="Experience is required.";
      if(!data.company || !data.company.trim()) e.company="Current company is required.";
      if(!data.designation || !data.designation.trim()) e.designation="Current designation is required.";
    } else {
      if(!data.specialization) e.specialization="Specialization is required.";
      if(!data.gradYear) e.gradYear="Year of graduation is required.";
    }
    setErrors(e);
    return Object.keys(e).length===0;
  }

  function submit(){
    if(!validate()) return;
    onSave(type,data);
  }

  const Field = ({field,label,required,children,span})=>(
    <div className={"form-field"+(span?" full":"")+(errors[field]?" error":"")}>
      <label>{label} {required && <span className="req">*</span>}</label>
      {children}
      {errors[field] && <span className="err-text">{errors[field]}</span>}
    </div>
  );

  return (
    <div>
      <div className="page-head">
        <div><h1 className="font-display">{mode==="add" ? "Add Profile" : (type==="professional" ? "Edit Professional Profile" : "Edit Student Profile")}</h1>
        <p>{mode==="add" ? "Choose a profile type and fill in the details below." : "Update the profile details below."}</p></div>
      </div>

      <div className="section-card">
        {mode==="add" && (
          <div className="tab-toggle">
            <button className={type==="professional"?"active":""} onClick={()=>setType("professional")}>Working Professional</button>
            <button className={type==="student"?"active":""} onClick={()=>setType("student")}>Student</button>
          </div>
        )}

        <div className="form-grid">
          <Field field="name" label="Full Name" required><input value={data.name} onChange={e=>update("name",e.target.value)} placeholder="e.g. Karthik R"/></Field>
          <Field field="mobile" label="Mobile Number" required><input value={data.mobile} onChange={e=>update("mobile",e.target.value.replace(/\D/g,"").slice(0,10))} placeholder="10-digit number"/></Field>
          <Field field="email" label="Email ID" required><input value={data.email} onChange={e=>update("email",e.target.value)} placeholder="name@example.com"/></Field>
          <Field field="district" label="Current District" required>
            <select value={data.district} onChange={e=>update("district",e.target.value)}>
              <option value="">Select district</option>
              {DISTRICTS.map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </Field>

          <Field field="photo" label="Photo Upload (File or Image/Google Drive Link)" span>
            <div className="photo-upload" style={{display:'flex',gap:16,alignItems:'center'}}>
              <Avatar name={data.name||"New User"} size={60} photo={data.photo}/>
              <div style={{display:'flex',flexDirection:'column',gap:8,flex:1}}>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  <label className="btn btn-secondary btn-sm" style={{cursor:'pointer',margin:0}}>
                    <I.Plus style={{width:14,height:14}}/> Choose Image File
                    <input type="file" accept="image/*" style={{display:'none'}} onChange={handleFileSelect}/>
                  </label>
                  {data.photo && (
                    <button type="button" className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>update("photo","")}>
                      <I.Trash style={{width:14,height:14}}/> Remove Photo
                    </button>
                  )}
                </div>
                <input type="text" value={data.photo||""} onChange={e=>update("photo",e.target.value)} placeholder="Or paste image URL / Google Drive photo link..." style={{fontSize:12.5,padding:'8px 12px',borderRadius:8,border:'1px solid var(--border)'}}/>
              </div>
            </div>
          </Field>

          {type==="professional" ? (
            <>
              <Field field="experience" label="Total Years of Experience" required><input type="number" step="0.1" value={data.experience} onChange={e=>update("experience",e.target.value)} placeholder="e.g. 4.5"/></Field>
              <Field field="company" label="Current Company" required><input value={data.company} onChange={e=>update("company",e.target.value)} placeholder="e.g. Cognizant"/></Field>
              <Field field="designation" label="Current Designation" required><input value={data.designation} onChange={e=>update("designation",e.target.value)} placeholder="e.g. Software Engineer"/></Field>
              <Field field="ctc" label="Current CTC"><input value={data.ctc} onChange={e=>update("ctc",e.target.value)} placeholder="e.g. 8.5 LPA"/></Field>
            </>
          ):(
            <>
              <Field field="specialization" label="Specialization" required>
                <select value={data.specialization} onChange={e=>update("specialization",e.target.value)}>
                  <option value="">Select specialization</option>
                  {SPECIALIZATIONS.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </Field>
              <Field field="gradYear" label="Year of Graduation" required>
                <select value={data.gradYear} onChange={e=>update("gradYear",e.target.value)}>
                  <option value="">Select year</option>
                  {GRAD_YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                </select>
              </Field>
            </>
          )}

          <Field field="education" label="Education Qualification" required>
            <select value={data.education} onChange={e=>update("education",e.target.value)}>
              <option value="">Select qualification</option>
              {EDUCATIONS.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </Field>
          <Field field="address" label="Current Address" span><textarea rows="3" value={data.address} onChange={e=>update("address",e.target.value)} placeholder="Door No, Street, Area, District, State"/></Field>
        </div>

        <div className="form-actions">
          <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}>{mode==="add" ? "Save Profile" : "Save Changes"}</button>
        </div>
      </div>
    </div>
  );
}

/* ============ DELETE MODAL ============ */
function DeleteModal({name,onCancel,onConfirm}){
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div className="modal-icon"><I.Alert/></div>
        <h3>Delete Profile?</h3>
        <p>Are you sure you want to delete <strong>{name}</strong>'s profile? This action cannot be undone.</p>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          <button className="btn btn-danger" onClick={onConfirm}>Delete Profile</button>
        </div>
      </div>
    </div>
  );
}

/* ============ ADMIN LOGIN MODAL ============ */
function LoginModal({onCancel,onSubmit}){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const [showPw,setShowPw]=useState(false);

  async function submit(){
    if(loading) return;
    setLoading(true); setError("");
    const result = await onSubmit(email.trim(), password);
    setLoading(false);
    if(!result.success) setError(result.error || "Incorrect email or password.");
  }


  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div className="modal-icon" style={{background:'#EEF0FF',color:'var(--indigo)'}}><I.Shield/></div>
        <h3>Admin Sign In</h3>
        <p>Sign in with an admin account to add or delete profiles.</p>
        <div className="login-field">
          <label>Email Address</label>
          <input value={email} onChange={e=>{setEmail(e.target.value);setError("");}}
            placeholder="learningeethal@gmail.com"
            onKeyDown={e=>{ if(e.key==='Enter') submit(); }}
            style={{width:'100%',boxSizing:'border-box'}}/>
        </div>
        <div className="login-field">
          <label>Password</label>
          <div style={{position:'relative',display:'flex',alignItems:'center'}}>
            <input
              type={showPw ? "text" : "password"}
              value={password}
              onChange={e=>{setPassword(e.target.value);setError("");}}
              placeholder="Enter password"
              onKeyDown={e=>{ if(e.key==='Enter') submit(); }}
              style={{width:'100%',paddingRight:42,boxSizing:'border-box'}}/>
            <button
              type="button"
              onClick={()=>setShowPw(s=>!s)}
              style={{position:'absolute',right:10,background:'none',border:'none',color:'var(--text-faint)',cursor:'pointer',padding:4,display:'flex',alignItems:'center'}}
              title={showPw ? "Hide password" : "Show password"}>
              {showPw ? (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              ) : (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              )}
            </button>
          </div>
        </div>
        {error && <p style={{color:'var(--red)',fontSize:12.5,margin:'-4px 0 12px',display:'flex',alignItems:'center',gap:5}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>
          {error}
        </p>}
        <p style={{fontSize:11.5,color:'var(--text-faint)',margin:'-2px 0 16px',lineHeight:1.4}}>Demo Access: <strong>learningeethal@gmail.com</strong> / <strong>EethalAdmin2026!</strong> (or <strong>admin</strong> / <strong>admin</strong>)</p>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onCancel} disabled={loading}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading ? "Signing in..." : "Sign In"}</button>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App(){
  const [role,setRole]=useState("viewer"); // "admin" | "viewer"
  const isAdmin = role==="admin";
  const [adminUser,setAdminUser]=useState(null);
  const [loginOpen,setLoginOpen]=useState(false);
  const [view,setView]=useState("dashboard");
  const [professionals,setProfessionals]=useState([]);
  const [students,setStudents]=useState([]);
  const [dataLoading,setDataLoading]=useState(true);
  const [dataError,setDataError]=useState("");
  const [notifications]=useState(NOTIFICATIONS);

  const [detail,setDetail]=useState(null); // {type, id}
  const [formState,setFormState]=useState(null); // {mode, type, data}
  const [deleteTarget,setDeleteTarget]=useState(null); // {type, item}
  const [toast,setToast]=useState("");

  const [globalSearch,setGlobalSearch]=useState("");
  const [notifOpen,setNotifOpen]=useState(false);
  const [profileOpen,setProfileOpen]=useState(false);

  async function loadData(){
    setDataLoading(true); setDataError("");
    try{
      const [pRes,sRes] = await Promise.all([fetch("/api/professionals"), fetch("/api/students")]);
      if(!pRes.ok || !sRes.ok) throw new Error("Server responded with an error.");
      const [pData,sData] = await Promise.all([pRes.json(), sRes.json()]);
      setProfessionals(pData);
      setStudents(sData);
    }catch(err){
      setDataError("Couldn't reach the Eethal Learning server. Make sure it's running (node server.js) and reload this page.");
    }finally{
      setDataLoading(false);
    }
  }
  useEffect(()=>{ loadData(); },[]);

  const changeView = useCallback((v)=>{ setView(v); setDetail(null); setFormState(null); }, []);
  const handleSearchSubmit = useCallback(()=>{ if(globalSearch.trim()) changeView("search"); }, [globalSearch, changeView]);
  const openDetail = useCallback((type,id)=>{ setDetail({type,id}); setFormState(null); }, []);
  const openAdd = useCallback(()=>{ setFormState({mode:"add", type: view==="students"?"student":"professional", data:null}); setDetail(null); }, [view]);
  const openEdit = useCallback((type,item)=>{ setFormState({mode:"edit", type, data:item}); setDetail(null); }, []);
  const openDelete = useCallback((type,item)=>{ setDeleteTarget({type,item}); }, []);

  async function handleLoginSubmit(email,password){
    try{
      const res = await fetch("/api/auth/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({email,password}),
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) return {success:false, error: data.error || "Incorrect email or password."};
      setRole("admin"); setAdminUser(data); setLoginOpen(false);
      setToast("Signed in as "+data.name.split(" ")[0]+".");
      return {success:true};
    }catch(err){
      return {success:false, error:"Couldn't reach the server. Is it running?"};
    }
  }
  function handleLogout(){
    setRole("viewer"); setAdminUser(null); setProfileOpen(false);
    changeView("dashboard");
    setToast("Signed out.");
  }

  async function handleSave(type,data){
    const endpoint = type==="professional" ? "/api/professionals" : "/api/students";
    try{
      if(formState.mode==="add"){
        const res = await fetch(endpoint, {
          method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data),
        });
        if(!res.ok) throw new Error("create failed");
        const record = await res.json();
        if(type==="professional") setProfessionals(list=>[record,...list]);
        else setStudents(list=>[record,...list]);
        setToast("Profile added successfully.");
      } else {
        const res = await fetch(endpoint+"/"+data.id, {
          method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data),
        });
        if(!res.ok) throw new Error("update failed");
        const record = await res.json();
        if(type==="professional") setProfessionals(list=>list.map(p=>p.id===record.id?record:p));
        else setStudents(list=>list.map(s=>s.id===record.id?record:s));
        setToast("Profile updated successfully.");
        if(detail && detail.id===record.id) setDetail({type,id:record.id});
      }
      setFormState(null);
    }catch(err){
      setToast("Couldn't save changes. Check the server connection.");
    }
  }

  async function confirmDelete(){
    const {type,item}=deleteTarget;
    const endpoint = (type==="professional" ? "/api/professionals/" : "/api/students/") + item.id;
    try{
      const res = await fetch(endpoint, {method:"DELETE"});
      if(!res.ok) throw new Error("delete failed");
      if(type==="professional") setProfessionals(list=>list.filter(p=>p.id!==item.id));
      else setStudents(list=>list.filter(s=>s.id!==item.id));
      setDeleteTarget(null);
      if(detail && detail.id===item.id) setDetail(null);
      setToast("Profile deleted successfully.");
    }catch(err){
      setDeleteTarget(null);
      setToast("Couldn't delete. Check the server connection.");
    }
  }

  const detailData = detail ? (detail.type==="professional" ? professionals.find(p=>p.id===detail.id) : students.find(s=>s.id===detail.id)) : null;

  let mainContent;
  if(dataLoading){
    mainContent = (
      <div className="empty-state">
        <I.Empty style={{color:'#C7CADC'}}/>
        <h3>Loading Eethal Learning&hellip;</h3>
        <p>Fetching profiles from the server.</p>
      </div>
    );
  } else if(dataError){
    mainContent = (
      <div className="empty-state">
        <I.Alert style={{color:'var(--red)',width:56,height:56}}/>
        <h3>Can&rsquo;t reach the server</h3>
        <p>{dataError}</p>
        <button className="btn btn-primary" onClick={loadData}>Try Again</button>
      </div>
    );
  } else if(formState){
    mainContent = <ProfileForm mode={formState.mode} initialType={formState.type} initialData={formState.data} onCancel={()=>setFormState(null)} onSave={handleSave}/>;
  } else if(detail && detailData){
    mainContent = <ProfileDetailPage type={detail.type} data={detailData}
      onBack={()=>setDetail(null)}
      onEdit={()=>openEdit(detail.type,detailData)}
      onDelete={()=>openDelete(detail.type,detailData)}
      isAdmin={isAdmin}/>;
  } else if(view==="dashboard"){
    mainContent = <Dashboard professionals={professionals} students={students} setView={changeView} openDetail={openDetail}/>;
  } else if(view==="professionals"){
    mainContent = <ProfessionalsPage professionals={professionals} openDetail={openDetail} openAdd={openAdd} openEdit={(t,i)=>openEdit(t,i)} openDelete={(t,i)=>openDelete(t,i)} isAdmin={isAdmin}/>;
  } else if(view==="students"){
    mainContent = <StudentsPage students={students} openDetail={openDetail} openAdd={openAdd} openEdit={(t,i)=>openEdit(t,i)} openDelete={(t,i)=>openDelete(t,i)} isAdmin={isAdmin}/>;
  } else if(view==="search"){
    mainContent = <SearchResultsPage query={globalSearch} professionals={professionals} students={students} openDetail={openDetail} openEdit={(t,i)=>openEdit(t,i)} openDelete={(t,i)=>openDelete(t,i)} isAdmin={isAdmin}/>;
  } else {
    mainContent = (
      <div>
        <div className="page-head"><div><h1 className="font-display">{view.charAt(0).toUpperCase()+view.slice(1)}</h1><p>This section is under construction.</p></div></div>
        <EmptyState title="Coming Soon" subtitle="This part of Eethal Learning is being built out. Check back shortly."/>
      </div>
    );
  }

  return (
    <div className={"app-shell"+(isAdmin?" with-sidebar":"")}>
      {isAdmin && <Sidebar view={view} setView={changeView} onLogout={handleLogout}/>}
      <div className="main-area">
        <TopHeader view={view} setView={changeView} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} onSearchSubmit={handleSearchSubmit}
          notifOpen={notifOpen} setNotifOpen={setNotifOpen} profileOpen={profileOpen} setProfileOpen={setProfileOpen}
          notifications={notifications} isAdmin={isAdmin} adminUser={adminUser}
          onRequestLogin={()=>setLoginOpen(true)} onLogout={handleLogout}/>
        <main className="content">{mainContent}</main>
      </div>
      <MobileBottomNav view={view} setView={changeView}/>
      {deleteTarget && <DeleteModal name={deleteTarget.item.name} onCancel={()=>setDeleteTarget(null)} onConfirm={confirmDelete}/>}
      {loginOpen && <LoginModal onCancel={()=>setLoginOpen(false)} onSubmit={handleLoginSubmit}/>}
      <Toast message={toast} onClose={()=>setToast("")}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
